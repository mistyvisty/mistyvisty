<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-label="A cute cat chasing a bouncing ball of yarn">
  <title>A cute cat chasing a bouncing ball of yarn</title>
  <style>
    .run    { animation: run 8s linear infinite; }
    .ballrun{ animation: ballrun 8s linear infinite; }
    .bounce { animation: bounce 0.8s cubic-bezier(.5,0,.5,1) infinite; }
    .spin   { animation: spin 0.8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .shadow { animation: shadow 0.8s cubic-bezier(.5,0,.5,1) infinite; transform-box: fill-box; transform-origin: center; }
    .bob    { animation: bob 0.3s ease-in-out infinite alternate; }
    .tail   { animation: wag 0.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 100% 100%; }
    .leg    { transform-box: fill-box; transform-origin: 50% 0%; }
    .legA   { animation: legA 0.3s ease-in-out infinite alternate; }
    .legB   { animation: legB 0.3s ease-in-out infinite alternate; }
    .ear    { animation: ear 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .blink  { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle{ animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t2 { animation-delay: .7s; }
    .t3 { animation-delay: 1.4s; }
    .cloud  { animation: drift 30s linear infinite; }
    .cloud2 { animation: drift 45s linear infinite; animation-delay: -20s; }

    @keyframes run     { from { transform: translateX(-240px); } to { transform: translateX(760px); } }
    @keyframes ballrun { from { transform: translateX(-60px);  } to { transform: translateX(940px); } }
    @keyframes bounce  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-55px); } }
    @keyframes shadow  { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(.5); opacity: .12; } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes bob     { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes wag     { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
    @keyframes legA    { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
    @keyframes legB    { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
    @keyframes ear     { 0%,85%,100% { transform: rotate(0); } 92% { transform: rotate(-12deg); } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes drift   { from { transform: translateX(820px); } to { transform: translateX(-200px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <clipPath id="card"><rect x="4" y="4" width="792" height="212" rx="22"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4DC"/>
      <stop offset="1" stop-color="#FFE9C2"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect x="4" y="4" width="792" height="212" rx="22" fill="url(#sky)" stroke="#F6B93B" stroke-width="3"/>

  <g clip-path="url(#card)">
    <!-- Clouds -->
    <g class="cloud" fill="#FFFFFF" opacity=".9">
      <ellipse cx="0" cy="45" rx="34" ry="14"/><ellipse cx="22" cy="36" rx="22" ry="14"/><ellipse cx="-20" cy="40" rx="18" ry="11"/>
    </g>
    <g class="cloud2" fill="#FFFFFF" opacity=".8">
      <ellipse cx="0" cy="70" rx="26" ry="10"/><ellipse cx="16" cy="63" rx="16" ry="10"/>
    </g>

    <!-- Sparkles -->
    <g fill="#F6B93B">
      <path class="twinkle"    d="M130 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
      <path class="twinkle t2" d="M660 34 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
      <path class="twinkle t3" d="M420 26 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
    </g>

    <!-- Ground -->
    <rect x="0" y="176" width="800" height="44" fill="#FBD38D"/>
    <line x1="0" y1="176" x2="800" y2="176" stroke="#E0A458" stroke-width="3"/>
    <g fill="#E0A458" opacity=".55">
      <circle cx="90" cy="196" r="3"/><circle cx="250" cy="205" r="2.5"/><circle cx="410" cy="193" r="3"/>
      <circle cx="560" cy="204" r="2.5"/><circle cx="720" cy="195" r="3"/>
    </g>

    <!-- Yarn ball -->
    <g class="ballrun">
      <ellipse class="shadow" cx="0" cy="178" rx="16" ry="4" fill="#8A5A2B"/>
      <g class="bounce">
        <g transform="translate(0 160)">
          <g class="spin">
            <circle r="16" fill="#FF8FB1" stroke="#D9577E" stroke-width="2.5"/>
            <path d="M-13 -8 Q0 -2 13 -9" fill="none" stroke="#D9577E" stroke-width="2"/>
            <path d="M-15 1 Q0 8 15 0" fill="none" stroke="#D9577E" stroke-width="2"/>
            <path d="M-10 11 Q2 5 11 11" fill="none" stroke="#D9577E" stroke-width="2"/>
            <path d="M-4 -15 Q-9 0 -3 15" fill="none" stroke="#D9577E" stroke-width="2"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Cat -->
    <g class="run">
      <g transform="translate(0 130)">
        <ellipse cx="4" cy="48" rx="52" ry="6" fill="#8A5A2B" opacity=".25"/>

        <!-- back legs (behind body) -->
        <rect class="leg legB" x="-34" y="12" width="12" height="32" rx="6" fill="#E58E26" stroke="#5A3A1A" stroke-width="2.5"/>
        <rect class="leg legA" x="20"  y="12" width="12" height="32" rx="6" fill="#E58E26" stroke="#5A3A1A" stroke-width="2.5"/>

        <g class="bob">
          <!-- tail -->
          <path class="tail" d="M-44 -2 C-72 -6 -80 -40 -62 -52" fill="none" stroke="#5A3A1A" stroke-width="14" stroke-linecap="round"/>
          <path class="tail" d="M-44 -2 C-72 -6 -80 -40 -62 -52" fill="none" stroke="#F6B93B" stroke-width="9" stroke-linecap="round"/>

          <!-- body -->
          <ellipse cx="0" cy="4" rx="48" ry="27" fill="#F6B93B" stroke="#5A3A1A" stroke-width="3"/>
          <path d="M-14 -21 q4 10 0 20 M0 -23 q4 11 0 22 M14 -21 q4 10 0 20" fill="none" stroke="#E58E26" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="6" cy="16" rx="24" ry="10" fill="#FFE3A3"/>

          <!-- head -->
          <g transform="translate(50 -22)">
            <path class="ear" d="M-18 -12 L-14 -38 L2 -20 Z" fill="#F6B93B" stroke="#5A3A1A" stroke-width="3" stroke-linejoin="round"/>
            <path class="ear" d="M4 -20 L20 -38 L22 -10 Z" fill="#F6B93B" stroke="#5A3A1A" stroke-width="3" stroke-linejoin="round"/>
            <path d="M-13 -16 L-12 -30 L-3 -20 Z M8 -20 L17 -30 L17 -15 Z" fill="#FF9FB8"/>
            <circle r="26" fill="#F6B93B" stroke="#5A3A1A" stroke-width="3"/>
            <!-- eyes -->
            <g class="blink">
              <ellipse cx="-6" cy="-3" rx="4.5" ry="6" fill="#2D1B0E"/>
              <ellipse cx="12" cy="-3" rx="4.5" ry="6" fill="#2D1B0E"/>
              <circle cx="-4.5" cy="-5.5" r="1.8" fill="#FFFFFF"/>
              <circle cx="13.5" cy="-5.5" r="1.8" fill="#FFFFFF"/>
            </g>
            <!-- blush -->
            <ellipse cx="-12" cy="9" rx="5" ry="3" fill="#FF8FB1" opacity=".7"/>
            <ellipse cx="20"  cy="9" rx="5" ry="3" fill="#FF8FB1" opacity=".7"/>
            <!-- nose + mouth -->
            <path d="M1 5 l5 0 -2.5 3 z" fill="#E75480"/>
            <path d="M3.5 8 q-3 5 -6 2 M3.5 8 q3 5 6 2" fill="none" stroke="#5A3A1A" stroke-width="1.8" stroke-linecap="round"/>
            <!-- whiskers -->
            <path d="M16 6 l14 -3 M16 10 l14 2 M-10 6 l-14 -3 M-10 10 l-14 2" stroke="#5A3A1A" stroke-width="1.5" stroke-linecap="round"/>
          </g>
        </g>

        <!-- front legs (in front of body) -->
        <rect class="leg legA" x="-20" y="14" width="12" height="32" rx="6" fill="#F6B93B" stroke="#5A3A1A" stroke-width="2.5"/>
        <rect class="leg legB" x="34"  y="14" width="12" height="32" rx="6" fill="#F6B93B" stroke="#5A3A1A" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Caption -->
    <text x="400" y="204" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#8A5A2B">fetching insights, one bug at a time</text>
  </g>
</svg>
